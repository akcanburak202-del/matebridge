<!-- MateBridge icon, concept C "M çizgisi" (user choice 2026-10-02). Master geometry for both apps.
     Glyph box 100x100; app tile: glyph placed at translate(17 17) scale(0.66) on a full-bleed 100x100 tile.
     Tile: vertical gradient top #121820 → bottom #050608. Glyph colour #7FE0D0. App glyph stroke 9, dot r 6.75.
     Menu bar template glyph: same path in the full 100 box, stroke 10, dot r 7.5, single colour (template). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g transform="translate(17 17) scale(0.66)" fill="none" stroke="#7FE0D0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 74 C20 46, 26 30, 34 30 C42 30, 44 56, 50 56 C56 56, 58 30, 66 30 C74 30, 80 46, 84 74"/>
    <circle cx="84" cy="74" r="6.75" fill="#7FE0D0" stroke="none"/>
  </g>
</svg>
